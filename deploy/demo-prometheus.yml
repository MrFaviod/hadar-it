# Synthetic targets are discovered anew after every shared demo reset.
# Only private Compose backend targets; no alerting, rules or remote_write.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 60s
scrape_configs:
  - job_name: demo-node
    http_sd_configs:
      - url: http://backend:8000/api/v1/demo/telemetry/targets
        refresh_interval: 15s
