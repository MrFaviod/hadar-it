# TLS entrypoint for an ITSM installation exposed beyond loopback.
#
# This file replaces /etc/nginx/nginx.conf inside the optional `proxy` service
# (Compose profile `tls`). It terminates TLS for one origin and forwards to the
# frontend (UI), the API (/api/) and the first-start wizard (/api/setup/v1/) of
# the same Compose project.
#
# Certificates are never stored here. The operator supplies the PEM material
# externally as ITSM_TLS_CERTIFICATE and ITSM_TLS_CERTIFICATE_KEY; Compose mounts
# them as files at the paths below. A full chain in ITSM_TLS_CERTIFICATE is
# expected. The listener is 8080 inside the container because the process runs
# as the unprivileged nginx user and must not bind a privileged port; Compose
# publishes it on 127.0.0.1:18443 by default.
#
# ITSM_AUTH_ORIGIN must be the exact browser origin served here
# (for example https://itsm.example.com), otherwise cookie-authenticated
# mutations are refused by the backend's Origin guard. The backend keeps its own
# request, body and session limits; the limits below are only a transport-level
# layer in front of them.
#
# No plain-HTTP listener is defined: this file is the TLS entrypoint, not a
# redirector. Publish only the TLS port for an exposed installation.

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    # Writable paths stay inside the container's tmpfs; the image is read-only.
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server_tokens off;
    # Matches ITSM_ATTACHMENT_MAX_BYTES (10 MiB) plus multipart headroom.
    client_max_body_size 12m;
    keepalive_timeout 30s;

    # The UI bundle is large text; proxied responses are only compressed with gzip_proxied.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Transport-level flood control per client address. The backend's own
    # limits remain the authority; this only absorbs anonymous bursts.
    limit_req_zone $binary_remote_addr zone=api:10m rate=3r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Upstreams are named per request instead of declared in `upstream` blocks.
    # A static `server backend:8000` makes nginx refuse to boot when the API (or
    # the wizard) does not exist yet, which is exactly the state of a fresh
    # installation; nginx must start alone, serve the UI, and let the missing
    # API surface as 502/503 through /api/.
    #
    # The cost is no upstream keepalive pool: with a variable proxy_pass each
    # request opens its own connection. Nginx resolves the names through the
    # Docker embedded DNS at request time, so a container recreated with a new
    # address is picked up without a reload.

    upstream itsm_ui {
        server frontend:8080;
        keepalive 8;
    }

    server {
        listen 8080 ssl;
        http2 on;
        server_name _;

        # Docker embedded DNS. Required by the variable proxy_pass targets
        # below, which are resolved per request instead of at boot.
        resolver 127.0.0.11 valid=10s ipv6=off;

        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_certificate_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:tls:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        # Same diagnostic policy as the plain HTTP UI edge; not enforcement.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Report-Only, and stricter than a browser compile would like: no unsafe-eval.
        # srcdoc frames inherit this policy; the isolated extension document has its own enforcing CSP.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        # The current HTTP edge owns these headers (including upstream errors).
        # Preserve resource-specific enforcing CSP from the backend unchanged.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy-Report-Only;

        # The wizard is a separate service and must stay reachable while the
        # database and the API are absent. A longer prefix wins over /api/, so
        # setup traffic never reaches the API location below.
        #
        # A variable proxy_pass with no URI of its own forwards the request
        # untouched only if $request_uri is appended; without it nginx sends
        # every request to the upstream as "/" and the wizard answers 404.
        # The host stays a fixed variable, never request data.
        location /api/setup/v1/ {
            set $setup_upstream http://setup:8100;
            proxy_pass $setup_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            # Setup steps are short; a stuck probe must not pin a worker.
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_buffering off;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            limit_conn conn 30;
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            # Report rendering is bounded at 120s by ITSM_REPORT_RENDER_TIMEOUT_SECONDS.
            proxy_read_timeout 130s;
            proxy_send_timeout 130s;
            # keep the response stream (and backend response quiescence) intact
            proxy_buffering off;
        }

        # Legacy UI scripts and styles are not fingerprinted: revalidate with ETag instead of caching blindly.
        location /assets/ {
            limit_conn conn 60;
            # expires (not add_header) keeps the server-level security headers inherited.
            expires epoch;
            proxy_pass http://itsm_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            limit_conn conn 60;
            proxy_pass http://itsm_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
