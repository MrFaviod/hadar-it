# SNMP Exporter configuration used by deploy/prometheus.yml.
#
# No credentials are stored in this repository. This file intentionally
# contains modules only: an empty auths map is invalid for the exporter, so the
# monitoring-snmp profile fails closed until the operator supplies an auths
# document externally. Compose projects the ITSM_SNMP_AUTHS environment value
# as /run/secrets/snmp_auths.yml and passes it as an additional --config.file;
# auths from that file are merged with these modules. See docs/operations.md.
# ITSM stores only the auth reference name per asset; Prometheus passes it to
# /snmp?auth=<reference>. Never commit communities or USM passphrases.
#
# Module `if_mib` is the default used by the fixed Prometheus SNMP job; an
# asset may select another module that you add below.
auths: {}

version: 2

modules:
  if_mib:
    walk:
      - 1.3.6.1.2.1.1.3
      - 1.3.6.1.2.1.2.2.1.7
      - 1.3.6.1.2.1.2.2.1.8
      - 1.3.6.1.2.1.31.1.1.1.6
      - 1.3.6.1.2.1.31.1.1.1.10
    metrics:
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: Time since the network management portion of the system was last re-initialized.
      - name: ifAdminStatus
        oid: 1.3.6.1.2.1.2.2.1.7
        type: gauge
        help: The desired state of the interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: The current operational state of the interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: The total number of octets received on the interface (64-bit counter).
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: The total number of octets transmitted on the interface (64-bit counter).
        indexes:
          - labelname: ifIndex
            type: gauge
