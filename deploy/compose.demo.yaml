# Public demonstration overlay.
#
#   RELEASE_MODE=demo ITSM_AUTH_ORIGIN=https://demo.example.com \
#     docker compose --env-file /dev/null -f compose.yaml -f deploy/compose.demo.yaml up -d
#
# One shared fictional installation (decision D1), exposed through the optional
# `tls` profile. `initialize` migrates, claims the database for demo and seeds
# the fictional dataset plus the `admin`/`admin` visitor administrator; the API
# then resets it every 60 minutes in-process.
#
# Reset contract (backend/docs/demo-reset.md): one explicit, existing, owned data
# directory; main SQLite database, attachment directory and SQLite task file as
# separate non-overlapping descendants; exactly one API process; no external
# demo task consumer. The worker is therefore behind a profile nobody enables by
# default, and Redis/Postgres task storage is not accepted here.

x-demo-environment: &demo-environment
  ITSM_DEMO_DATA_DIRECTORY: /data/demo
  # demo.db is the name the demo telemetry and reset code expect inside that
  # directory.
  ITSM_DATABASE_URL: sqlite:////data/demo/demo.db
  ITSM_TASK_STORAGE: sqlite
  ITSM_TASK_SQLITE_PATH: /data/demo/tasks/huey.db
  ITSM_ATTACHMENT_STORAGE_PATH: /data/demo/attachments
  # Exact browser origin of the public installation. Never guessed: cookie
  # authentication and the CSRF/Origin guards compare against it.
  ITSM_AUTH_ORIGIN: ${ITSM_AUTH_ORIGIN:?Set ITSM_AUTH_ORIGIN to the exact public origin of the demo}
  # Synthetic telemetry stays inside this mode's private Compose network.
  ITSM_PROMETHEUS_URL: http://demo-prometheus:9090
  # No real provider, executor, broker, validator, notification or search
  # integration is reachable from the demonstration, whatever the operator's
  # shell exports. Empty values fail closed; the demo capability set refuses
  # these surfaces anyway.
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  ITSM_AI_CREDENTIAL_KEY: ""
  ITSM_AI_BROKER_URL: ""
  ITSM_AI_BROKER_TOKEN: ""
  ITSM_SYSTEM_EXECUTOR_URL: ""
  ITSM_SYSTEM_EXECUTOR_TOKEN: ""
  ITSM_HERMES_INSPECTOR_URL: ""
  ITSM_HERMES_INSPECTOR_TOKEN: ""
  ITSM_EXTENSION_VALIDATOR_URL: ""
  ITSM_EXTENSION_VALIDATOR_TOKEN: ""
  ITSM_ALERTMANAGER_URL: ""
  ITSM_ALERTMANAGER_TOKEN: ""
  ITSM_MONITORING_SECRETS: "{}"
  ITSM_AI_SECRET_DESTINATIONS: "{}"
  ITSM_MONITORING_INGEST_TOKEN: ""
  ITSM_MEILISEARCH_URL: ""
  ITSM_MEILISEARCH_API_KEY: ""
  ITSM_TASK_POSTGRES_DSN: ""
  # Public visitor credential for the demonstration owner account. It is not a
  # secret: `admin`/`admin` is the documented public login of a fictional
  # installation, it exists only in demo mode, and the initializer refuses a
  # production environment before it creates any state.
  ITSM_BOOTSTRAP_PASSWORD: ${ITSM_DEMO_ADMIN_PASSWORD:-admin}

x-demo-volumes: &demo-volumes
  # The inherited app/tasks/attachments volumes are replaced on purpose: the
  # whole demonstration state must live under the owned data directory.
  # Mounted at /data and not at /data/demo on purpose: Docker creates the mount
  # point itself, and `python -m itsm.demo init` refuses an existing directory.
  # The initializer therefore creates /data/demo (its parent already exists).
  volumes: !override [demo-data:/data]

services:
  initialize:
    environment: *demo-environment
    <<: *demo-volumes
    # The initializer refuses an existing directory and the image does not
    # pre-create it, so a first start creates the demonstration, and every later
    # start only re-checks migrations. A directory that exists without its
    # database is a broken installation: fail loudly instead of serving 503.
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -e /data/demo ]; then
          [ -f /data/demo/demo.db ] || {
            echo "demo: /data/demo exists without demo.db; inspect it or choose a new data volume" >&2
            exit 1
          }
        else
          python -m itsm.demo init --directory /data/demo --username admin
        fi
        python -m itsm.deployment prepare

  backend:
    environment: *demo-environment
    <<: *demo-volumes
    # The launcher derives uvicorn's proxy-header trust from ITSM_TRUSTED_PROXY.
    # A bare `uvicorn itsm.main:app` already trusts X-Forwarded-For from a
    # loopback peer, letting a visitor mint a fresh rate-limit bucket (R1-02).
    command: [python, -m, itsm.main, --host, 0.0.0.0, --port, "8000", --no-access-log]

  # Refused by the shared-reset contract. Kept only so an operator sees why it
  # must stay off; the profile name states the intent.
  worker:
    profiles: [demo-external-consumer]
    environment: *demo-environment
    <<: *demo-volumes

  # Demo never offers the claim flow: the wizard is absent rather than idle.
  # The profile name states the intent; dev and prod run setup normally.
  setup:
    profiles: [setup-excluded]

  # The wizard's one-shot volume initializer follows it out of demo.
  setup-volume-init:
    profiles: [setup-excluded]

  # Optional synthetic scraper (S17): current UUIDs are discovered over the
  # private backend route every 15s, including after hourly resets. No host
  # network or published ports; no alerting/rules/remote_write. Storage is tmpfs.
  demo-prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    profiles: [monitoring-demo]
    command:
      - --config.file=/etc/prometheus/demo-prometheus.yml
      - --storage.tsdb.path=/tmp/prometheus
      - --storage.tsdb.retention.time=${ITSM_DEMO_PROMETHEUS_RETENTION:-1d}
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./deploy/demo-prometheus.yml:/etc/prometheus/demo-prometheus.yml:ro,Z
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

volumes:
  demo-data:
