name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  root:
    name: Root documentation and Compose contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # frontend/ and backend/ are separate repositories and are not checked out here.
      - name: Documentation and publication contracts
        run: python3 tests/prealpha_docs.py
      # Renders dev, prod and demo with `--env-file /dev/null`, RELEASE_MODE and
      # ITSM_SELINUX_LEVEL set by the test. It starts no containers and builds nothing.
      - name: Compose render contract
        run: python3 tests/release_modes_compose.py
