name: itsm

x-backend: &backend
  image: itsm-backend:0.1.0
  build: ./backend
  init: true
  environment: &backend-env
    ITSM_DATABASE_URL: ${ITSM_DATABASE_URL:-postgresql+psycopg://itsm:${ITSM_POSTGRES_PASSWORD:-}@postgres:5432/itsm}
    ITSM_TASK_STORAGE: ${ITSM_TASK_STORAGE:-sqlite}
    ITSM_TASK_SQLITE_PATH: /data/tasks/huey.db
    ITSM_ATTACHMENT_STORAGE_PATH: /data/attachments
    ITSM_ATTACHMENT_MAX_BYTES: ${ITSM_ATTACHMENT_MAX_BYTES:-10485760}
    ITSM_TASK_REDIS_URL: ${ITSM_TASK_REDIS_URL:-redis://redis:6379/0}
    ITSM_TASK_POSTGRES_DSN: ${ITSM_TASK_POSTGRES_DSN:-}
    ITSM_TASK_RETRIES: ${ITSM_TASK_RETRIES:-2}
    ITSM_TASK_RETRY_DELAY_SECONDS: ${ITSM_TASK_RETRY_DELAY_SECONDS:-1}
    ITSM_DEMO_PERIODIC_MINUTES: ${ITSM_DEMO_PERIODIC_MINUTES:-0}
    ITSM_LOG_LEVEL: ${ITSM_LOG_LEVEL:-INFO}
    ITSM_AUTH_ORIGIN: ${ITSM_AUTH_ORIGIN:-http://localhost:18080}
    ITSM_AUTH_COOKIE_SECURE: ${ITSM_AUTH_COOKIE_SECURE:-true}
    ITSM_AGENT_MODEL: ${ITSM_AGENT_MODEL:-}
    ITSM_AGENT_MAX_STEPS: ${ITSM_AGENT_MAX_STEPS:-8}
    ITSM_AGENT_MAX_HISTORY_MESSAGES: ${ITSM_AGENT_MAX_HISTORY_MESSAGES:-20}
    ITSM_AGENT_MAX_OUTPUT_TOKENS: ${ITSM_AGENT_MAX_OUTPUT_TOKENS:-1024}
    ITSM_AGENT_OPENAI_BASE_URL: ${ITSM_AGENT_OPENAI_BASE_URL:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ITSM_PROMETHEUS_URL: ${ITSM_PROMETHEUS_URL:-}
    ITSM_MEILISEARCH_URL: ${ITSM_MEILISEARCH_URL:-}
    ITSM_SERVICE_REDIS_URL: ${ITSM_SERVICE_REDIS_URL:-}
  volumes:
    # Shared between API, migration and worker: lowercase z avoids private MCS labels.
    - app-data:/data/app:z
    - task-data:/data/tasks:z
    - attachment-data:/data/attachments:z
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  backend:
    <<: *backend
    ports: ["127.0.0.1:${ITSM_API_PORT:-18000}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    <<: *backend
    command: [python, -m, huey.bin.huey_consumer, itsm.tasks.runtime.huey, -w, "1", -k, thread]
    stop_grace_period: 30s

  migrate:
    <<: *backend
    profiles: [tools]
    restart: "no"
    command: [alembic, upgrade, head]

  frontend:
    image: itsm-frontend:0.1.0
    build: ./frontend
    init: true
    ports: ["127.0.0.1:${ITSM_FRONTEND_PORT:-18080}:8080"]
    depends_on:
      backend:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
    profiles: [local-postgres]
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: ${ITSM_POSTGRES_PASSWORD:-}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U itsm -d itsm"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2.4-alpine@sha256:a308ca111032fa8f306a2dc7be7ba5deb8b777ed5d258c733cddba48a1fd7904
    profiles: [redis]
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.37.0@sha256:9cde2774864e6c19cdd09fcd2950bc01ac9a0454b6f343fffafa14faae6eb7ea
    profiles: [search]
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${ITSM_MEILI_MASTER_KEY:-}
      MEILI_NO_ANALYTICS: "true"
    volumes: [search-data:/meili_data]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${ITSM_PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${ITSM_PROMETHEUS_PORT:-19090}:9090"]
    restart: unless-stopped

volumes:
  app-data:
  task-data:
  attachment-data:
  postgres-data:
  redis-data:
  search-data:
  prometheus-data:
