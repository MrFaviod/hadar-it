name: itsm

x-backend: &backend
  image: itsm-backend:0.1.0
  build: ./backend
  init: true
  # OpenCode and Hermes run on the host, not in application containers.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &backend-env
    ITSM_DATABASE_URL: ${ITSM_DATABASE_URL:-postgresql+psycopg://itsm:${ITSM_POSTGRES_PASSWORD:-}@postgres:5432/itsm}
    ITSM_TASK_STORAGE: ${ITSM_TASK_STORAGE:-sqlite}
    ITSM_TASK_SQLITE_PATH: /data/tasks/huey.db
    ITSM_ATTACHMENT_STORAGE_PATH: /data/attachments
    ITSM_ATTACHMENT_MAX_BYTES: ${ITSM_ATTACHMENT_MAX_BYTES:-10485760}
    ITSM_REPORT_BASE_URL: ${ITSM_REPORT_BASE_URL:-http://localhost:18080}
    ITSM_REPORT_RETENTION_DAYS: ${ITSM_REPORT_RETENTION_DAYS:-7}
    ITSM_REPORT_MAX_ASSETS: ${ITSM_REPORT_MAX_ASSETS:-1000}
    ITSM_REPORT_MAX_DOCUMENT_BYTES: ${ITSM_REPORT_MAX_DOCUMENT_BYTES:-52428800}
    ITSM_REPORT_RENDER_TIMEOUT_SECONDS: ${ITSM_REPORT_RENDER_TIMEOUT_SECONDS:-120}
    ITSM_REPORT_RENDER_MEMORY_MB: ${ITSM_REPORT_RENDER_MEMORY_MB:-512}
    ITSM_TASK_REDIS_URL: ${ITSM_TASK_REDIS_URL:-redis://redis:6379/0}
    ITSM_TASK_POSTGRES_DSN: ${ITSM_TASK_POSTGRES_DSN:-}
    ITSM_TASK_RETRIES: ${ITSM_TASK_RETRIES:-2}
    ITSM_TASK_RETRY_DELAY_SECONDS: ${ITSM_TASK_RETRY_DELAY_SECONDS:-1}
    ITSM_DEMO_PERIODIC_MINUTES: ${ITSM_DEMO_PERIODIC_MINUTES:-0}
    ITSM_LOG_LEVEL: ${ITSM_LOG_LEVEL:-INFO}
    ITSM_AUTH_ORIGIN: ${ITSM_AUTH_ORIGIN:-http://localhost:18080}
    ITSM_AUTH_COOKIE_SECURE: ${ITSM_AUTH_COOKIE_SECURE:-true}
    ITSM_AGENT_MODEL: ${ITSM_AGENT_MODEL:-}
    ITSM_AGENT_MAX_STEPS: ${ITSM_AGENT_MAX_STEPS:-8}
    ITSM_AGENT_MAX_HISTORY_MESSAGES: ${ITSM_AGENT_MAX_HISTORY_MESSAGES:-20}
    ITSM_AGENT_MAX_OUTPUT_TOKENS: ${ITSM_AGENT_MAX_OUTPUT_TOKENS:-1024}
    ITSM_AGENT_OPENAI_BASE_URL: ${ITSM_AGENT_OPENAI_BASE_URL:-}
    # Required only for encrypted provider credential administration; keep outside SQL backups.
    ITSM_AI_CREDENTIAL_KEY: ${ITSM_AI_CREDENTIAL_KEY:-}
    # Ordinary User inference fails closed without the separate host-side container broker.
    # Do not mount the Docker socket or application SQL volumes into User runtimes.
    ITSM_AI_BROKER_URL: ${ITSM_AI_BROKER_URL:-}
    ITSM_AI_BROKER_TOKEN: ${ITSM_AI_BROKER_TOKEN:-}
    # Optional independently authenticated host-owned Hermes launch inspector.
    ITSM_HERMES_INSPECTOR_URL: ${ITSM_HERMES_INSPECTOR_URL:-}
    ITSM_HERMES_INSPECTOR_TOKEN: ${ITSM_HERMES_INSPECTOR_TOKEN:-}
    # Optional fixed-action executor; credentials remain externally supplied.
    ITSM_SYSTEM_EXECUTOR_URL: ${ITSM_SYSTEM_EXECUTOR_URL:-}
    ITSM_SYSTEM_EXECUTOR_TOKEN: ${ITSM_SYSTEM_EXECUTOR_TOKEN:-}
    ITSM_SYSTEM_EXECUTOR_TIMEOUT_SECONDS: ${ITSM_SYSTEM_EXECUTOR_TIMEOUT_SECONDS:-10}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # Monitoring. The local Prometheus profile is the default engine; an
    # external instance is selected with ITSM_PROMETHEUS_URL. Blank optional
    # values mean "not configured": inventory-only startup stays valid.
    ITSM_PROMETHEUS_URL: ${ITSM_PROMETHEUS_URL:-http://prometheus:9090}
    ITSM_PROMETHEUS_TOKEN: ${ITSM_PROMETHEUS_TOKEN:-}
    ITSM_ALERTMANAGER_URL: ${ITSM_ALERTMANAGER_URL:-}
    ITSM_ALERTMANAGER_TOKEN: ${ITSM_ALERTMANAGER_TOKEN:-}
    ITSM_MONITORING_INGEST_TOKEN: ${ITSM_MONITORING_INGEST_TOKEN:-}
    ITSM_MONITORING_DISCOVERY_TOKEN: ${ITSM_MONITORING_DISCOVERY_TOKEN:-}
    ITSM_MONITORING_HTTP_TIMEOUT_SECONDS: ${ITSM_MONITORING_HTTP_TIMEOUT_SECONDS:-10}
    ITSM_MONITORING_PUBLIC_URL: ${ITSM_MONITORING_PUBLIC_URL:-http://localhost:18080}
    ITSM_MONITORING_POLL_SECONDS: ${ITSM_MONITORING_POLL_SECONDS:-60}
    ITSM_NOTIFICATION_RETENTION_DAYS: ${ITSM_NOTIFICATION_RETENTION_DAYS:-90}
    # JSON map of Apprise reference -> full URL/token, supplied externally.
    ITSM_MONITORING_SECRETS: ${ITSM_MONITORING_SECRETS:-{}}
    ITSM_MEILISEARCH_URL: ${ITSM_MEILISEARCH_URL:-}
    ITSM_MEILISEARCH_API_KEY: ${ITSM_MEILISEARCH_API_KEY:-${ITSM_MEILI_MASTER_KEY:-}}
    ITSM_MEILISEARCH_HTTP_TIMEOUT_SECONDS: ${ITSM_MEILISEARCH_HTTP_TIMEOUT_SECONDS:-5}
    ITSM_SEARCH_INDEX_NAME: ${ITSM_SEARCH_INDEX_NAME:-itsm_entities}
    ITSM_SEARCH_SYNC_BATCH_SIZE: ${ITSM_SEARCH_SYNC_BATCH_SIZE:-100}
    ITSM_SERVICE_REDIS_URL: ${ITSM_SERVICE_REDIS_URL:-}
  volumes:
    # Docker-managed named volumes are shared by API, migration and worker.
    - app-data:/data/app
    - task-data:/data/tasks
    - attachment-data:/data/attachments
  security_opt:
    - no-new-privileges:true
    # Reserve one distinct level per installation; every shared-volume consumer
    # must retain it, including later migration and bootstrap commands.
    - label=level:${ITSM_SELINUX_LEVEL:?Reserve an installation-specific SELinux MCS level before running Compose}
  cap_drop: [ALL]
  restart: unless-stopped

services:
  backend:
    <<: *backend
    ports: ["127.0.0.1:${ITSM_API_PORT:-18000}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    <<: *backend
    command: [python, -m, huey.bin.huey_consumer, itsm.tasks.runtime.huey, -w, "1", "-k", thread]
    stop_grace_period: 30s

  migrate:
    <<: *backend
    profiles: [tools]
    restart: "no"
    command: [alembic, upgrade, head]

  frontend:
    image: itsm-frontend:0.1.0
    build: ./frontend
    init: true
    ports: ["127.0.0.1:${ITSM_FRONTEND_PORT:-18080}:8080"]
    depends_on:
      backend:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
    profiles: [local-postgres]
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: ${ITSM_POSTGRES_PASSWORD:-}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U itsm -d itsm"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2.4-alpine@sha256:a308ca111032fa8f306a2dc7be7ba5deb8b777ed5d258c733cddba48a1fd7904
    profiles: [redis]
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.37.0@sha256:9cde2774864e6c19cdd09fcd2950bc01ac9a0454b6f343fffafa14faae6eb7ea
    profiles: [search]
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${ITSM_MEILI_MASTER_KEY:-}
      MEILI_NO_ANALYTICS: "true"
    volumes: [search-data:/meili_data]
    restart: unless-stopped

  # Optional metric engine. Persistent TSDB with configurable retention; the
  # discovery bearer token is injected as a Compose secret from the external
  # environment, never committed. Rules are a fixed versioned bundle.
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${ITSM_PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./deploy/prometheus-rules.yml:/etc/prometheus/rules/itsm-rules.yml:ro,Z
      - prometheus-data:/prometheus
    secrets: [monitoring_discovery_token]
    ports: ["127.0.0.1:${ITSM_PROMETHEUS_PORT:-19090}:9090"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  # Optional prober for ICMP, HTTP(S), TCP and DNS checks.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    profiles: [monitoring-blackbox]
    command: [--config.file=/etc/blackbox_exporter/blackbox.yml]
    volumes:
      - ./deploy/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro,Z
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  # Optional SNMP prober for switches, gateways, routers and UPS devices.
  # Credentials are projected from the external environment as a Compose
  # secret file; the committed modules file has no auths and cannot fake one.
  snmp-exporter:
    image: prom/snmp-exporter:v0.30.1@sha256:e5fd5e8b43ace6c088fe9bf0b37b7fff0e04380bee352be7ec41b853a4dd5859
    profiles: [monitoring-snmp]
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/run/secrets/snmp_auths.yml
    volumes:
      - ./deploy/snmp.yml:/etc/snmp_exporter/snmp.yml:ro,Z
    secrets:
      - source: snmp_auths
        target: snmp_auths.yml
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  # Optional host metrics for this Docker host. Host networking and PID view
  # are required for the network/process namespace to be the host itself, not
  # the container's; processes are still only observable, never modified.
  # Bind the loopback/interface you need and firewall port 9100.
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    profiles: [monitoring-node]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --web.listen-address=:9100
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
    network_mode: host
    pid: host
    volumes:
      # Read-only host views; never relabel host paths with :z/:Z.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  # Optional native Alertmanager. When enabled, set ITSM_ALERTMANAGER_URL to
  # http://alertmanager:9093 so ITSM delegates grouping, inhibition and
  # silences; without it the adapter polls Prometheus and keeps local
  # suppression for notifications only.
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    profiles: [monitoring-alertmanager]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
      - --web.listen-address=:9093
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,Z
      - alertmanager-data:/alertmanager
    secrets: [monitoring_ingest_token]
    ports: ["127.0.0.1:${ITSM_ALERTMANAGER_PORT:-19093}:9093"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

volumes:
  app-data:
  task-data:
  attachment-data:
  postgres-data:
  redis-data:
  search-data:
  prometheus-data:
  alertmanager-data:

# Bearer tokens are supplied through the external environment and materialized
# only inside the containers that need them. No secret file is committed.
secrets:
  monitoring_discovery_token:
    environment: ITSM_MONITORING_DISCOVERY_TOKEN
  monitoring_ingest_token:
    environment: ITSM_MONITORING_INGEST_TOKEN
  snmp_auths:
    environment: ITSM_SNMP_AUTHS
